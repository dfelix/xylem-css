name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: npm ci
      - run: npm run build
      # dist/ isn't committed (it's built on publish), so check the build wrote it
      - name: Check the build output
        run: test -s dist/xylem.css && test -s dist/xylem.min.css && test -s docs/dist/xylem.css
